spring.application.name=jade-spa-admin

spring.datasource.url=jdbc:mysql://localhost:3306/jade_spa
spring.datasource.username=jade_app
spring.datasource.password=jadespa

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jade.admin.email=${ADMIN_EMAIL:}
jade.admin.password=${ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
